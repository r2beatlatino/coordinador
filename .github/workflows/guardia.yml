name: guardia
on: [push, pull_request]
jobs:
  guardia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python herramientas/guardia.py
      - run: python herramientas/catalogo.py --comprobar
      - run: python pruebas/probar_repo.py
      - run: sudo apt-get update && sudo apt-get install -y age
      - run: python pruebas/probar_respaldo.py
